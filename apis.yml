name: MUSINSA
description: 'MUSINSA is South Korea''s leading online fashion platform, founded in 2001 by Cho Man-ho as
  a streetwear community and now operating a marketplace that connects more than 10,000 brands with over
  16 million members. The company reported roughly USD 3.3 billion in GMV and USD 907 million in revenue
  for 2024, returned to operating profit, and is pursuing a KOSPI IPO. MUSINSA runs domestic and global
  storefronts (musinsa.com, global.musinsa.com), a partner/seller program for K-fashion brands, and an
  engineering organization that publishes on the MUSINSA tech blog. It has raised funding from investors
  including KKR, Sequoia/Peak XV (formerly Sequoia Capital China / HongShan) and IMM Investment. No genuine
  public product/developer API or OpenAPI-backed developer portal was found during enrichment; a corporate
  CMS Swagger UI at dev-api.corp.musinsa.com is an internal tool (its public spec still points at the
  Swagger petstore demo), so this profile captures company identity and domain-security posture only.'
